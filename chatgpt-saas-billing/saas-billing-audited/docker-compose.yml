services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billing_local_password}
    volumes:
      - billing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__BillingDb: Host=db;Port=5432;Database=billing;Username=billing;Password=${POSTGRES_PASSWORD:-billing_local_password}
      Payments__HmacSecret: ${PAYMENTS_HMAC_SECRET:-change-this-dev-hmac-secret}
      Payments__CheckoutBaseUrl: https://checkout.test/pay
      Ops__ApiKey: ${OPS_API_KEY:-change-this-dev-ops-key}
      Recovery__PollingIntervalSeconds: 5
      SubscriptionExpiry__PollingIntervalSeconds: 30
    ports:
      - "8080:8080"

volumes:
  billing_pgdata:
