services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Billing: Host=db;Database=billing;Username=billing;Password=billing
      Billing__WebhookSecret: ${WEBHOOK_SECRET:-dev-webhook-secret}
    ports:
      - "8080:8080"

volumes:
  pgdata:
