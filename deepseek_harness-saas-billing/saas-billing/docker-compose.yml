services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: saas_billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    ports:
      - "5432:5432"
    volumes:
      - billing-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d saas_billing"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=saas_billing;Username=billing;Password=billing"
      Database__AutoMigrate: "true"
      # Override this in any non-local environment.
      Payments__Test__Secret: "${WEBHOOK_SECRET:-dev_test_webhook_secret_change_me}"
      Billing__Recovery__Enabled: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  billing-postgres:
